name: test.yml
on:
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod

      - name: Test
        run: make test-ci

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod

      - name: Package
        run: make dist

  ci_pass:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - test
      - package
    steps:
      - name: check status
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
